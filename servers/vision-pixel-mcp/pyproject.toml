[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matsci-vision-pixel-mcp"
version = "0.1.0"
description = "Generic pixel-level vision MCP server — crop, dominant colors, pixel diff, foreground extraction, SVG trace, image summary"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Huginn contributors"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["mcp", "vision", "image", "pixel", "llm"]
dependencies = [
    "mcp>=1.28.1,<2.0",
    "Pillow>=12.3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vision-pixel-mcp = "server:console_main"

[project.urls]
Repository = "https://github.com/toki0413/matsci/tree/master/servers/vision-pixel-mcp"
Issues = "https://github.com/toki0413/matsci/issues"

[tool.setuptools]
py-modules = ["server"]