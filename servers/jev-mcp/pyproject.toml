[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matsci-jev-mcp"
version = "0.1.0"
description = "JEV MCP server — TypeSafe System One decision model (Noul/Choice/Score) as MCP tools"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Huginn contributors"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["mcp", "jev", "system-one", "decision", "typesafe", "llm"]
dependencies = [
    "mcp>=1.28.1,<2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
jev-mcp = "server:console_main"

[project.urls]
Repository = "https://github.com/toki0413/matsci/tree/master/servers/jev-mcp"
Issues = "https://github.com/toki0413/matsci/issues"

[tool.setuptools]
py-modules = ["server"]