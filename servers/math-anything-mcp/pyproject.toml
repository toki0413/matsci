[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matsci-math-anything-mcp"
version = "0.1.0"
description = "Math semantics MCP server — equation/variable extraction (LaTeX), mathematical diff, dimensional analysis, precision tracking"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Huginn contributors"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["mcp", "math", "latex", "dimensional-analysis", "llm"]
dependencies = [
    "mcp>=1.28.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
math-anything-mcp = "server:console_main"

[project.urls]
Repository = "https://github.com/toki0413/matsci/tree/master/servers/math-anything-mcp"
Issues = "https://github.com/toki0413/matsci/issues"

[tool.setuptools]
py-modules = ["server"]