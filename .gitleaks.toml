# gitleaks 密钥扫描配置。
#
# 用 [extend] useDefault 继承 gitleaks 内置规则集，仅在此追加 allowlist。
# allowlist 只按"具体占位假值"豁免 `agent/tests/` 里的测试夹具 —— 这些文件
# 故意用明文假密钥测越权/隐私逻辑（AWS 官方示例 key、模板化私钥、wrong-key），
# 不是真实凭据。按值正则豁免意味着：若有人往这些文件塞真实 key，仍会被拦下。
[extend]
useDefault = true

[allowlist]
description = "agent/tests 测试夹具中的占位假密钥（AWS 官方示例 / 模板私钥 / wrong-key，非真实凭据；DeepSeek 真实 key 条目已删除）"
regexes = [
  # pentest_api_security.py 里故意用错 key 测越权
  "wrong-key-12345",
  # test_privacy.py 里 AWS 官方示例 access key 占位符
  "AKIAIOSFODNN7EXAMPLE",
  # test_privacy.py 里模板化的 OpenSSH 私钥占位符。源码里 `\n` 是字面"反斜杠+n"，
  # 故 TOML 需写 \\\\n 才能让 regex 匹配字面反斜杠 (而非换行符)；`{body}` 是普通
  # 花括号 (非量词)，无需转义。
  "-----BEGIN OPENSSH PRIVATE KEY-----\\\\n{body}\\\\n-----END OPENSSH PRIVATE KEY----",
  # 注意：此前这里有一条 DeepSeek 真实 key "sk-462d…6aa6" 被当作"示例假 key"豁免，
  # 导致 CI 扫描长期被压制。已删除该条并用 --replace-text 从历史中抹除 key 本身。
  # 历史残留（uv.lock 已被 drop）：lock 文件里 64 位 hex 占位 token，非真实凭据。
  "eaaaef47c2406277181d2086484c317bf7fc433e2d5d03ff94f56b0dcec87471",
]