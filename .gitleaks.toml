# gitleaks 密钥扫描配置。
#
# 用 [extend] useDefault 继承 gitleaks 内置规则集，仅在此追加 allowlist。
# allowlist 一律按"具体值"豁免，不做按目录路径的整体豁免 —— 这样即使某目录
# 历史上混入过真实 key，也只豁免已知的那一个值；别处再出现真实 key 仍会被拦下。
[extend]
useDefault = true

[allowlist]
description = "按具体值豁免：agent/tests 占位假密钥 + 已泄漏待轮换的 InternLM key 前缀指纹 + 假设指纹 hex 误报"
regexes = [
  # pentest_api_security.py 里故意用错 key 测越权
  "wrong-key-12345",
  # test_privacy.py 里 AWS 官方示例 access key 占位符
  "AKIAIOSFODNN7EXAMPLE",
  # test_privacy.py 里模板化的 OpenSSH 私钥占位符。源码里 `\n` 是字面"反斜杠+n"，
  # 故 TOML 需写 \\\\n 才能让 regex 匹配字面反斜杠 (而非换行符)；`{body}` 是普通
  # 花括号 (非量词)，无需转义。
  "-----BEGIN OPENSSH PRIVATE KEY-----\\\\n{body}\\\\n-----END OPENSSH PRIVATE KEY----",
  # 注意：此前这里有一条 DeepSeek 真实 key "sk-462d…6aa6" 被当作"示例假 key"豁免，
  # 导致 CI 扫描长期被压制。已删除该条并用 --replace-text 从历史中抹除 key 本身。
  # 历史残留（uv.lock 已被 drop）：lock 文件里 64 位 hex 占位 token，非真实凭据。
  "eaaaef47c2406277181d2086484c317bf7fc433e2d5d03ff94f56b0dcec87471",
  # PR #49 把本地脚手架 _scratch/run*.sh 一并带入 master, 其中硬编码了真实的
  # InternLM key (`export INTERNLM_API_KEY=sk-pGqi…`)。该 key 已泄漏, 必须在
  # InternLM 后台吊销并轮换。此处**只按前缀指纹豁免这一个值**, 不做 `_scratch/`
  # 路径整体豁免: 轮换后此为死值, 且别处/别的 key 一旦出现仍会被拦下。
  # 根治手段是 _scratch/ 已加入 .gitignore 不再入库 (见 .gitignore)。
  "sk-pGqiBxo[0-9A-Za-z]+",
  # research_outputs 引擎状态/计划模式文件里的假设指纹 (12 位 hex, 如 hyp_key),
  # 被 generic-api-key 的内置熵判据误判成密钥。按具体值豁免这两枚误报指纹。
  "584c6720e9bd",
  "309ad2c755d7",
]