name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGINN_PROMPT_CACHE_CONTROL: "0"
  HUGINN_ALLOW_LOCAL_BASH: "1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check huginn tests

      - name: Check formatting with black
        run: black --check huginn tests

      - name: Type check with mypy
        run: mypy huginn
        continue-on-error: true

      - name: Dependency vulnerability scan
        run: |
          uv pip install pip-audit
          pip-audit --desc || true

      - name: Test with pytest and coverage
        run: python -m pytest tests -q --cov=huginn --cov-report=xml --cov-fail-under=60

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUGINN_PROMPT_CACHE_CONTROL: "0"
      HUGINN_ALLOW_LOCAL_BASH: "1"
      HUGINN_DEV_MODE: "1"
      HUGINN_API_KEY: "test-key-12345"
      HUGINN_RATE_LIMIT_PER_MINUTE: "0"
      STRESS_TEST_URL: "http://localhost:8999"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install -e ".[dev,all]"

      - name: Start server
        run: |
          nohup python -m huginn.server --port 8999 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8999/health/live > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "::error::Server failed to start"
          cat server.log
          exit 1

      - name: Run stress tests
        run: python -m pytest tests/stress/ -q --tb=short -p no:cov

      - name: Run ultra-long benchmark
        run: python tests/ultra_long_benchmark.py

      - name: Stop server
        if: always()
        run: |
          kill $(cat server.pid) 2>/dev/null || true
          cat server.log || true
