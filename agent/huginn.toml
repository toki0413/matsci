# ── IM 网关 (QQ / WeChat) ─────────────────────────────────────────
# 一键连通: 优先用 huginn.env 里的 BOT_QQ_API_URL / BOT_WECHAT_API_URL
# 引导 (启动时自动设 enabled=true). 这里仅作文档化模板, 也可直接改后重启.
[bot.qq]
enabled = false            # 填了 BOT_QQ_API_URL 后启动时自动置 true
platform = "qq"            # OneBot v11
api_url = ""               # e.g. http://127.0.0.1:5700 (go-cqhttp/Lagrange/NapCat)
bot_id = ""                # 机器人 QQ 号
admin_users = []# 管理员 QQ
allowed_groups = []# 群白名单, 空 = 不限

[bot.wechat]
enabled = false            # 填了 BOT_WECHAT_API_URL 后启动时自动置 true
api_url = ""               # e.g. http://localhost:9011 (iLink daemon)
bot_id = ""
admin_users = []

