provider = "deepseek"
model = "deepseek-reasoner"
api_key = ""  # P0-9: 从 DEEPSEEK_API_KEY 环境变量读, 不再明文硬编码
base_url = "https://api.deepseek.com"
team_mode_enabled = false
max_concurrent_subagents = 3
plan_auto_confirm = false
ollama_host = "http://localhost:11434"
execution_backend = "local"
hpc_scheduler = "local"
hpc_port = 22
remote_work_dir = "~/huginn_jobs"
hpc_default_walltime = "24:00:00"
hpc_default_nodes = 1
hpc_default_ntasks_per_node = 4
hpc_default_gpus_per_node = 0
hpc_max_retries = 3
hpc_retry_backoff = 1.0
hpc_strict_host_key_checking = true
workspace = "env:HUGINN_WORKSPACE"  # 从 HUGINN_WORKSPACE 环境变量展开, 不硬编码机器路径
auto_approve = false
enable_exploration = true
max_parallel_branches = 5
persona = "default"
persona_auto_route = true
persona_auto_route_threshold = 0.3
rag_enabled = false
kg_enabled = false
kg_depth = 1
kg_top_k = 10
local_only_mode = false
encryption_enabled = false
encrypt_rag_documents = true
encrypt_rag_metadata = true
encrypt_config = false
privacy_redact_secrets = true
privacy_block_on_secrets = false
max_tool_output_tokens = 25000
context_budget_tokens = 0
prompt_cache_control = true
telemetry_enabled = true
memory_decay_enabled = false
memory_decay_interval_turns = 0
memory_decay_prune_threshold = 0.15
tool_compression_max_tokens = 8000
pet_name = "Huginn"
pet_personality = "cheerful"
config_version = 1
# R_phys 推理时 steering 强度 λ (0=关闭, >0=物理奖励作为正交 steering 方向注入 frontier 排序)
phys_steering_gain = 0.0

# ── 模型池 (multi-LLM) ──────────────────────────────────────────────
# 一键连通: 在 huginn.env 里填好对应 *_API_KEY 后, 把该条的 enabled 改 true
# 即可启用; api_key 留空会自动从环境变量读取 (registry.resolve_provider_key).
# 默认全部 enabled=false, 避免注册成"幽灵模型"在调用时才失败.
# 当前启用的默认模型是 deepseek (alias=default, lead agent 指向它).

[[models]]
alias = "default"
provider = "deepseek"
model = "deepseek-reasoner"
api_key = ""  # P0-9: 从 DEEPSEEK_API_KEY 环境变量读
base_url = "https://api.deepseek.com"
temperature = 0.7
enabled = true

