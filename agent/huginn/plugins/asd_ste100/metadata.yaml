name: asd_ste100
version: "1.1.0"
author: Huginn Integration
description: >
  ASD-STE100 Simplified Technical English discipline for agent-facing text and
  structured communication. Injects controlled-language rules into the system
  prompt and provides two deterministic, model-free linters: ste_lint for prose
  (tool descriptions, error messages, inter-agent messages) and comms_lint for
  structured messages (events, workflow handoffs, agent-to-agent results). Port
  of danyuchn/asd-ste100-skill (MIT).
huginn_version_range: ">=0.1.0"
homepage: https://github.com/danyuchn/asd-ste100-skill
repo: https://github.com/danyuchn/asd-ste100-skill