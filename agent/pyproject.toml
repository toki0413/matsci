[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huginn-agent"
version = "0.2.0"
description = "Material Science specialized AI Agent Harness"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Huginn contributors"}]
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["llm", "agent", "materials-science", "dft", "molecular-dynamics", "fea", "cfd"]
dependencies = [
    "pydantic>=2.13",
    "langchain>=1.3.14",
    "langchain-core>=1.5.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    # langgraph 1.x 把 sqlite checkpointer 拆成独立包. checkpointer.py 直接 import
    # langgraph.checkpoint.sqlite, 缺这个包生产环境会 ModuleNotFoundError, 进程重启后
    # 所有对话状态丢失. 列为生产必需依赖.
    "langgraph-checkpoint-sqlite>=2.0.0",
    "deepagents>=0.5.0",
    "click>=8.3.3",
    "rich>=13.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "z3-solver>=4.12",
    "aiohttp>=3.14.3",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    # config.py 用 toml.dumps/loads 读写 TOML 配置. Python 3.11+ 内置 tomllib
    # 只能读不能写, config.py 的 save_config 需要 dumps → 必须装 toml 包.
    # 之前未声明, 生产环境调 /credentials/import_from_config 会 ImportError.
    "toml>=0.10.2",
    # mcp 2.0 是 major 跳跃 (API 重构), 暂锁 1.x, 单独评估后再升.
    "mcp>=1.28.1,<2.0",
    # server
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "sse-starlette>=3.4.6",
    "python-multipart>=0.0.6",
    "httpx>=0.25",
    "websockets>=12.0",
    "requests>=2.32.0",
    "tenacity>=8.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-benchmark>=4.0", "pytest-github-actions-annotate-failures>=0.2", "pytest-cov>=4.0", "pytest-xdist>=3.0", "hypothesis>=6.0", "black>=23.0", "memory-profiler>=0.60", "ruff>=0.4.0", "mypy>=1.5", "pre-commit>=3.0", "pip-audit>=2.7"]
all = ["pymatgen>=2025.10.7", "ase>=3.22", "dscribe>=2.0", "paramiko>=5.0.0",
        # LSP 符号级编辑 (lsp_tool): 纯 Python 静态分析, 零外部进程, 沙箱安全.
        "jedi>=0.19",
        # chromadb PYSEC-2026-311: 预认证代码注入, 仅影响 HTTP API 的
        # /api/v2/.../collections 端点 + trust_remote_code=true. huginn 用
        # PersistentClient (本地嵌入式, 不暴露 HTTP), 不受影响. 无 fix version.
        "chromadb>=0.4",
        "sentence-transformers>=2.5", "pymupdf>=1.23", "pypdf>=6.13.3", "easyocr>=1.7", "pytesseract>=0.3", "py4vasp>=0.5", "chgnet>=0.3", "matplotlib>=3.7", "SciencePlots>=2.2", "ultraplot>=0.1"]
# ML 势能模型互斥: mace-torch 要 e3nn==0.4.4, fairchem-core 要 e3nn>=0.5.
# 拆成两个 group, 按需装其一, 避免 uv lock 解析失败.
ml-mace = ["mace-torch>=0.3"]
ml-fairchem = ["fairchem-core>=1.0"]
# pynep 不在公开 PyPI (NEP 模型本地接口), 按需本地装.
ml-nep = ["pynep>=0.1"]
# AtomWorld benchmark (arXiv:2510.04704): verifiable 3D 空间推理 eval.
# 只在接 RCBench / CodeAct 沙箱做 eval 时装, 默认 pip install -e . 不拉.
# MiSI-Bench (arXiv:2512.10867): 微观空间智能, image-in/text-out, 需 datasets + rdkit.
benchmark = [
    "atomworld[benchmark] @ git+https://github.com/MasterAI-EAM/AtomWorld.git",
    "datasets>=2.14",
    "rdkit>=2023.9",
]
# 科研图表 skill: AI 绘图 prompt 编译器 (论文/图注 -> Nano Banana/Qwen Image/GPT Image prompt).
# 克隆到 huginn/plugins/science-skills/skills/happy_figure/ 即生效, 无 Python 依赖.
# Flint MCP server (交互式 web 图表副通道): npx -y flint-chart-mcp, 配置见项目根 .mcp.json.
rag = ["chromadb>=0.4", "sentence-transformers>=2.5", "pymupdf>=1.23", "pypdf>=6.14.2", "easyocr>=1.7", "pytesseract>=0.3", "jieba>=0.42"]
tooluniverse = ["tooluniverse"]
# 材料数据库真实查询 (mat-db MCP): 无 MP_API_KEY 时 server 回退 mock 数据.
# mp-api 体积较大默认不装, 按需 pip install -e .[db] 后设 MP_API_KEY 即接真实 Materials Project.
db = ["mp-api>=0.12"]
# Rust 性能扩展 (huginn-ext, 源码在仓库根 /pyext)。Rust 沙箱快路径默认关闭
# (HUGINN_USE_RUST_SANDBOX=1 才启用), 按需安装。huginn-ext 尚未发布到公开 PyPI
# 前, 从 GitHub Release 资产安装对应 python 版本 wheel 即可。
rust = ["huginn-ext>=0.1"]

[project.scripts]
huginn-agent = "huginn.cli:main"

[project.urls]
Repository = "https://github.com/huginn-agent/huginn"
Documentation = "https://github.com/huginn-agent/huginn/blob/main/docs/architecture.md"
Issues = "https://github.com/huginn-agent/huginn/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["huginn*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --cov-fail-under is NOT set here: CI passes --cov-fail-under=60 explicitly
# (see .github/workflows/ci.yml). Local runs use [tool.coverage.report].fail_under.
addopts = "--cov=huginn --cov-report=term-missing"
markers = [
    "integration: heavy tests that need full stack (skip on fast CI)",
    "network: tests requiring external network or model download",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function-call-in-default-argument (common in dataclasses)
    "SIM108", # use ternary operator (style preference)
    "N803",  # scientific/math naming uses uppercase (X, E, T)
    "N806",  # same for local variables
    "B905",  # zip() strict= is too noisy across the legacy codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741", "F841", "N806", "B905"]
"tests/_fakenp_plugin.py" = ["N801"]  # 模拟 numpy ndarray 类名, 刻意小写
"huginn/evaluation/core.py" = ["N803", "N806"]
"huginn/unified/*.py" = ["N806"]
"huginn/tensor_algebra.py" = ["N806"]
"huginn/visualize.py" = ["N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
incremental = true
cache_dir = ".mypy_cache"
# 渐进式收紧: 先发现冗余 cast 与不再需要的 type:ignore, 不强制全量注解.
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    '^tests/',
    '^build/',
    '^dist/',
    '^\.git/',
    '^\.tox/',
]


[[tool.mypy.overrides]]
module = [
    "pymatgen.*",
    "langchain.*",
    "langchain_core.*",
    "langgraph.*",
    "numpy.*",
    "sklearn.*",
    "chromadb.*",
    "sentence_transformers.*",
    "matplotlib.*",
    "PIL.*",
    "ase.*",
    "dscribe.*",
    "docker.*",
    "paramiko.*",
    "aiohttp.*",
    "cryptography.*",
]
follow_imports = "skip"
[tool.coverage.run]
source = ["huginn"]
omit = [
    "*/tests/*",
    "huginn/_version.py",
    "huginn/visualize.py",
]

[tool.coverage.report]
# Coverage gate: aligns with CI's --cov-fail-under=60.
# Local `pytest` (without explicit --cov-fail-under) uses this value.
fail_under = 60
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",  # protocol/body-less methods
]

[dependency-groups]
dev = [
    "langchain-openai>=1.4.1",
    "memory-profiler>=0.61.0",
    "pyinstaller>=6.21.0",
    "pytest-benchmark>=5.2.3",
]
