services:
  postgres:
    image: postgres:16-alpine
    environment:
      # ⚠️ 生产环境必须通过 .env 覆盖: POSTGRES_PASSWORD=<强随机值>
      POSTGRES_USER: ${POSTGRES_USER:-huginn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huginn_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-huginn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 只绑定到 localhost, 避免数据库暴露到外网
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huginn -d huginn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # 生产环境应配置 requirepass: redis-server --requirepass <强随机值>
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-huginn_dev_only}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-huginn_dev_only}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # ⚠️ 生产环境必须设置强随机 HUGINN_API_KEY, 默认 changeme 仅供本地开发
      HUGINN_API_KEY: ${HUGINN_API_KEY:?必须设置 HUGINN_API_KEY}
      HUGINN_CORS_ORIGINS: ""
      HUGINN_CONTAINER_RUNTIME: ${HUGINN_CONTAINER_RUNTIME:-none}
      HUGINN_WORKSPACE: /app/workspace
      HUGINN_RATE_LIMIT_PER_MINUTE: ${HUGINN_RATE_LIMIT_PER_MINUTE:-60}
      # Persistence backends will be wired in Phase 2.
      # HUGINN_DATABASE_URL: postgresql://huginn:${POSTGRES_PASSWORD}@postgres:5432/huginn
      # HUGINN_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
      - huginn_state:/app/.huginn
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  huginn_state:
