name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          # Lightweight optional deps — keeps test coverage up on CI
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Run tests
        env:
          HUGINN_RATE_LIMIT_ENABLED: "false"
          HUGINN_RATE_LIMIT_PER_MINUTE: "0"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HUGINN_CI: "1"
        run: |
          cd agent
          python -m pytest -q --cov-fail-under=40 --timeout=60 -m "not network" \
            --ignore=tests/test_api_contract.py \
            --ignore=tests/test_security_penetration.py \
            --ignore=tests/test_chaos_engineering.py \
            --ignore=tests/stress \
            --ignore=tests/loops \
            --ignore=tests/sci_automation_test.py \
            --tb=short --maxfail=5 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose failures to step summary
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f agent/pytest_output.txt ]; then
            {
              echo '## pytest failures (last 150 lines)'
              echo '```'
              tail -150 agent/pytest_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            grep -E '^FAILED' agent/pytest_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=pytest::${line}"
            done
          else
            echo "::error::pytest_output.txt not found"
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: agent/pytest_output.txt
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-file: tests/test_api_contract.py
            label: api-contract
            job-timeout: 30
            test-timeout: 60
          - test-file: tests/test_security_penetration.py
            label: security-penetration
            job-timeout: 20
            test-timeout: 120
          - test-file: tests/test_chaos_engineering.py
            label: chaos-engineering
            job-timeout: 20
            test-timeout: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Run integration tests
        env:
          HUGINN_RATE_LIMIT_ENABLED: "false"
          HUGINN_RATE_LIMIT_PER_MINUTE: "0"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HUGINN_CI: "1"
        run: |
          cd agent
          pytest ${{ matrix.test-file }} -v --no-cov -m "integration and not network" --tb=short --timeout=${{ matrix.test-timeout }} 2>&1 | tee pytest_integration_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose integration failures to step summary
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f agent/pytest_integration_output.txt ]; then
            {
              echo '## integration test failures (last 150 lines)'
              echo '```'
              tail -150 agent/pytest_integration_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            grep -E '^(FAILED|ERROR|_ test)' agent/pytest_integration_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=integration::${line}"
            done
          fi

      - name: Upload integration test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-integration-${{ matrix.label }}
          path: agent/pytest_integration_output.txt
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install and build
        run: |
          cd desktop
          npm ci
          npm run build

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"

      - name: Policy engine self-check
        run: |
          cd agent
          python -m huginn.security.policy_engine

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit || true

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev librsvg2-dev

      # 显式确认 openssl 原生库 + 头文件 + pkg-config 元数据都到位.
      # cargo 链接失败多半是 .so 找不到 / pkg-config 没配好, 这里先打出来
      # 免得靠猜. 失败不中断 (exit 0), 只留日志.
      - name: Verify libssl / openssl toolchain
        run: |
          echo "── dpkg: libssl packages ──"
          dpkg -l | grep -E 'libssl|openssl' || echo "(none found)"
          echo "── pkg-config: openssl ──"
          pkg-config --modversion openssl 2>&1 || echo "pkg-config openssl FAILED"
          echo "── pkg-config: openssl cflags ──"
          pkg-config --cflags --libs openssl 2>&1 || echo "pkg-config openssl cflags FAILED"
          echo "── headers: /usr/include/openssl/ssl.h ──"
          ls -l /usr/include/openssl/ssl.h 2>&1 || echo "ssl.h MISSING"
          echo "── libs: libssl.so ──"
          ldconfig -p | grep -E 'libssl\.so|libcrypto\.so' || echo "libssl.so not in ld cache"

      # tauri-build / generate_context! 在 cargo check 时校验 tauri.conf.json
      # 引用的所有文件路径. CI 上没有 sidecar 二进制、没有 npm build 产物、
      # python-runtime 只有 .gitkeep. 把所有文件系统依赖清掉, 只留编译检查.
      - name: Strip tauri config for CI compile
        working-directory: desktop/src-tauri
        run: |
          python -c "
          import json
          with open('tauri.conf.json') as f:
              cfg = json.load(f)
          cfg['bundle']['externalBin'] = []
          cfg['bundle']['resources'] = []
          cfg['build']['beforeDevCommand'] = ''
          cfg['build']['beforeBuildCommand'] = ''
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
          print('Stripped externalBin/resources/beforeCommands from tauri.conf.json')
          "
          mkdir -p ../dist
          [ -f ../dist/index.html ] || echo '<!DOCTYPE html><html></html>' > ../dist/index.html
          echo 'Stub dist created'

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: |
          # tee 全量日志落盘, sed 去 ANSI 色码方便 grep
          cargo check --workspace 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee cargo_check_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose cargo failures to step summary
        if: failure()
        working-directory: desktop/src-tauri
        run: |
          if [ -f cargo_check_output.txt ]; then
            {
              echo '## cargo check output (last 150 lines)'
              echo '```'
              tail -150 cargo_check_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            # 常规 error/warning 行做 annotation
            grep -E '^(error|warning)' cargo_check_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=cargo::${line}"
            done
            # openssl / 原生链接错误单独挖出来, 判断是不是 libssl 缺
            OPENSSL_HITS=$(grep -iE 'openssl|libssl|libcrypto|cannot find|undefined reference|linker|runtime path|pkg-config' cargo_check_output.txt | head -40)
            if [ -n "$OPENSSL_HITS" ]; then
              {
                echo '## openssl / native link diagnostics'
                echo '```'
                echo "$OPENSSL_HITS"
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
            fi
            # cc 底层错误通常带 "error:" 前缀但不在行首, 抓 final 编译失败行
            CC_HITS=$(grep -E '\berror\b|error:' cargo_check_output.txt | grep -viE '^error\[' | head -30)
            if [ -n "$CC_HITS" ]; then
              {
                echo '## cc / native compile errors'
                echo '```'
                echo "$CC_HITS"
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload cargo output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-check-output
          path: desktop/src-tauri/cargo_check_output.txt

      - name: Cargo test
        working-directory: desktop/src-tauri
        run: cargo test --workspace
