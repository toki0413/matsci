name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs when a new push lands on the same branch.
# Prevents stale test jobs from hogging runner slots.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4.0"

      - name: Run ruff check (gating)
        working-directory: agent
        run: |
          # Blocking gate: CI lint 必须全绿.
          ruff check .

  test:
    # 单一测试 job：pytest 自动发现整个 tests/ 目录，无手工 ignore 列表、
    # 无 ABCDE 分组。之前的分组/ignore 是为了绕开 TestClient 线程泄漏和
    # OOM；现在夹具全部用上下文管理器关闭 portal 线程（并有
    # tests/test_testclient_hygiene.py 护栏），根因已修，无需再手工维护分组。
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Add swap to prevent OOM
        run: |
          # runner 只有 7G RAM，全量测试串行跑会 OOM。加 6G swap 兜底。
          if [ ! -f /swapfile-ci ]; then
            sudo fallocate -l 6G /swapfile-ci
            sudo chmod 600 /swapfile-ci
            sudo mkswap /swapfile-ci
            sudo swapon /swapfile-ci
            echo "swap added:"
            swapon --show
          else
            echo "/swapfile-ci already exists"
          fi

      # First gate: TestClient-leak guard. Weightless (pathlib/re only), so it
      # fails fast before the heavy suite runs. Anyone who reintroduces
      # `client = TestClient(app)` without `with` gets an immediate red.
      - name: TestClient hygiene guard
        working-directory: agent
        run: python -m pytest tests/test_testclient_hygiene.py -q -o addopts=""

      # ADR-0001 单网关门禁：外部消费者 (scripts/examples/servers/...) 不得直接
      # import huginn.* 业务模块。weightless (AST/pathlib)，先于重型套件快速 fail。
      - name: Architecture single-gateway guard
        working-directory: agent
        run: python -m pytest tests/test_arch_single_gateway.py -q -o addopts=""

      # 机器无关门禁：禁止 git 跟踪的代码文件里出现 Windows 用户目录绝对路径
      # 或黑名单机器 token。weightless (git ls-files + regex)。
      - name: No-hardcoded-machine-paths guard
        working-directory: agent
        run: python -m pytest tests/test_arch_no_hardcoded_paths.py -q -o addopts=""

      # 端点契约门禁：CLI (cli/src/http.rs) 引用的每个 /v1 端点必须存在于后端
      # OpenAPI schema（方法与路径都要对上）。后端路由改名/删除后，CLI 若仍引用
      # 旧路径会静默 404，本门禁在 CI 里快速拦截。导入 app 生成 schema (~5s)。
      - name: Endpoint contract guard
        working-directory: agent
        run: python -m pytest tests/test_arch_endpoint_contract.py -q -o addopts=""

      # 配置 schema 迁移门禁：config_version 递增必须配套迁移函数，且与
      # HuginnConfig.config_version 一致。weightless，先于重型套件快速 fail。
      - name: Config migration guard
        working-directory: agent
        run: python -m pytest tests/test_arch_config_migration.py -q -o addopts=""

      # 技能池弥合门禁：evolution SkillTemplate ⇄ 声明式 SkillRegistry 的同步契约
      # （转换可注册、不覆盖 presets、统计 round-trip 供元技能闭环）。
      - name: Skill pool bridge guard
        working-directory: agent
        run: python -m pytest tests/test_arch_skill_pool_bridge.py -q -o addopts=""

      - name: MCP .mcp.json consumption guard
        working-directory: agent
        run: python -m pytest tests/test_arch_mcp_json.py -q -o addopts=""

      - name: MCP single-gateway guard
        working-directory: agent
        run: python -m pytest tests/test_arch_mcp_governance.py -q -o addopts=""

      - name: Plugin admission guard
        working-directory: agent
        run: python -m pytest tests/test_arch_plugin_governance.py -q -o addopts=""

      - name: Mat-DB real MP dependency guard
        working-directory: agent
        run: python -m pytest tests/test_arch_matdb_dep.py -q -o addopts=""

      - name: MP API key flow guard
        working-directory: agent
        run: python -m pytest tests/test_arch_mp_key_flow.py -q -o addopts=""

      - name: Credential gateway guard
        working-directory: agent
        run: python -m pytest tests/test_arch_credential_gateway.py -q -o addopts=""

      - name: Run full test suite
        env:
          HUGINN_RATE_LIMIT_ENABLED: "false"
          HUGINN_RATE_LIMIT_PER_MINUTE: "0"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HUGINN_CI: "1"
          # sklearn 的 GP 拟合底层走 scipy.linalg / OpenBLAS. 新版 numpy 在
          # GitHub runner 上偶发原生崩溃，锁成单线程是通用解法，顺带降内存。
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          cd agent
          # -n 0 (串行, 不 fork): 全 app 测试(TestClient)在 xdist fork 下会
          # 因 fork+threads 崩溃/OOM, 之前的手工分组正是为此。串行从根上
          # 规避, 不再需要维护分组。stress/ 与 benchmark/ 是重型长跑套件,
          # 留给专门触发, 不进默认 push。
          python -m pytest tests -v -rA --tb=line -p no:cov -o addopts="" \
            --timeout=60 --timeout-method=thread \
            -n 0 -m "not network" \
            --ignore=tests/stress --ignore=tests/benchmark \
            --maxfail=50 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose failures to step summary
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f agent/pytest_output.txt ]; then
            {
              echo '## pytest failures (last 150 lines)'
              echo '```'
              tail -150 agent/pytest_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            grep -E '^FAILED' agent/pytest_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=pytest::${line}"
            done
          else
            echo "::error::pytest_output.txt not found"
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: agent/pytest_output.txt
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install and build
        run: |
          cd desktop
          npm ci
          npm run build

  frontend-e2e:
    # 前端 Playwright E2E（chromium）。之前 CI 只有"构建无测试"的 frontend-build，
    # 真正的 UI→后端→WS 全链路验收没进 CI。本 job 由 Playwright config 的 webServer
    # 一并拉起 Vite + uvicorn 后端（reuseExistingServer=false），并在全局预热后端，
    # 因此后端契约用例不会因冷启动竞态被静默 skip；CI 下探不到后端会直接红（见
    # e2e/fixtures.ts backendReachable）。
    # 后端依赖安装镜像 test job 的已验证清单，保证 huginn.server 可导入。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Install frontend + Playwright chromium
        working-directory: desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run frontend E2E (chromium)
        working-directory: desktop
        env:
          HUGINN_API_KEY: ${{ secrets.HUGINN_API_KEY }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          # CI=true 时 Playwright 用 webServer 自己起 Vite+后端且不复用；
          # reporter=github 把失败行注进 PR/commit 检查。
          npx playwright test --project=chromium --reporter=github

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"

      - name: Policy engine self-check
        run: |
          cd agent
          python -m huginn.security.policy_engine

      - name: Dependency vulnerability scan
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Blocking gate 1: 扫当前环境已安装的包 (agent[dev] 主依赖).
          pip-audit --desc
          # Blocking gate 2: 基于 requirements.lock 严格审计, 覆盖可选依赖组
          # (chromadb/paramiko/pymatgen/fairchem 等) 的传递依赖. 这些不在
          # agent[dev] 里, --desc 扫不到, 是 Dependabot 告警的主要来源.
          # 用 uv 全量解析 (含 all 可选组) 到临时 lock, 再逐一审计.
          # 注意: ml-mace 与 ml-fairchem 因 e3nn 版本互斥, 分开解析审计.
          pip install uv
          cd agent
          uv pip compile pyproject.toml --extra all --extra rag --extra db \
            --python-version 3.12 -o /tmp/gate-all.lock
          uv pip compile pyproject.toml --extra all --extra ml-fairchem \
            --python-version 3.12 -o /tmp/gate-fairchem.lock
          uv pip compile pyproject.toml --extra all --extra ml-mace \
            --python-version 3.12 -o /tmp/gate-mace.lock
          # 已知"无 fix 可用"的漏洞放行 (详见 dependabot.yml ignore 注释):
          #   - chromadb  PYSEC-2026-311 / GHSA-f4j7-r4q5-qw2c: 预认证代码注入,
          #     仅影响 HTTP API + trust_remote_code=true; huginn 全程嵌入式
          #     PersistentClient, 不受影响. 上游无 fix 版本.
          #   - setuptools PYSEC-2026-3447 / GHSA-h35f-9h28-mq5c: MANIFEST.in
          #     NFC/NFD 绕过, 仅打包 sdist 时触发; 仅 fairchem 可选组经
          #     fairchem-core 硬约束 setuptools<81.0.0 被锁死在 80.10.2, 无法升级.
          #   - torch PYSEC-2025-193/194/195/203/204/206, PYSEC-2026-139/2286,
          #     CVE-2025-2999, CVE-2025-3001:
          #     仅 fairchem 可选组经 fairchem-core 硬约束 torch~=2.8.0 引入;
          #     fairchem-core 2.21.0 的 torch~=2.8.0 是 >=2.8.0,<3.0 闭区间,
          #     pyproject 无法单独提 torch>=2.12 (会与 fairchem 冲突导致解析失败).
          #     其他组 (mace/all) 用无漏洞的 torch 2.13.0. 上游锁死无法升级.
          #     注: CVE-2025-2999/3001 是 torch.jit 相关 critical, 同属此硬约束,
          #     必须一并 ignore, 否则 CI 会因这 2 个漏网告警变红.
          # 其余任何漏洞都会让 CI 变红, 强制升级修复.
          # 注意: 不能把三个组的钉版行合并审计 —— 不同组可能锁定同一包的不同
          # 版本 (如 fsspec), pip-audit 内部用 pip 解析会报 ResolutionImpossible.
          # 因此对每个组单独 --ignore-vuln 审计.
          for lock in /tmp/gate-all.lock /tmp/gate-fairchem.lock /tmp/gate-mace.lock; do
            pip-audit -r "$lock" --vulnerability-service osv \
              --ignore-vuln PYSEC-2026-311 --ignore-vuln GHSA-f4j7-r4q5-qw2c \
              --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-h35f-9h28-mq5c \
              --ignore-vuln PYSEC-2025-193 --ignore-vuln PYSEC-2025-194 \
              --ignore-vuln PYSEC-2025-195 --ignore-vuln PYSEC-2025-203 \
              --ignore-vuln PYSEC-2025-204 --ignore-vuln PYSEC-2025-206 \
              --ignore-vuln PYSEC-2026-139 --ignore-vuln PYSEC-2026-2286 \
              --ignore-vuln CVE-2025-2999 --ignore-vuln CVE-2025-3001 \
              || { echo "::error::optional-dependency vulnerability(s) in $lock. 可修复漏洞必须升级约束版本; 新增无 fix 漏洞需先在 dependabot.yml 显式 ignore 并记录理由"; exit 1; }
          done

      - name: npm dependency vulnerability scan
        run: |
          cd desktop
          npm audit --audit-level=high || { echo "::error::npm dependency vulnerability(s) found. 运行 npm audit fix 修复, 或升级受影响包"; exit 1; }

      - name: Install test dependencies
        run: |
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama

      - name: SAST scan with bandit
        run: |
          pip install bandit
          cd agent
          # HIGH severity 必须为 0 (阻断 CI), MEDIUM 仅打印警告
          bandit -r huginn/ -lll || exit 1
          bandit -r huginn/ -ll -s B101 2>&1 | grep -E "Issue:|Total issues" || true
          # tests/ 目录单独扫, 允许 B101 (assert)
          bandit -r tests/ -lll -s B101 || exit 1

      - name: Run archive security PoC tests
        run: |
          cd agent
          python -m pytest tests/security/pentest_archive_safety.py -v --no-cov

      - name: Run API security PoC tests
        run: |
          cd agent
          python -m pytest tests/security/pentest_api_security.py -v --no-cov

      - name: Run API fuzz tests
        run: |
          cd agent
          python -m pytest tests/security/fuzz_api.py -v --no-cov

  deps-and-secrets:
    # 制度化闭环 P2：依赖 lock（uv）+ 密钥扫描（gitleaks）。
    # 1) 依赖锁漂移门禁：pyproject.toml 变更后必须同步重生成 requirements.lock，
    #    保证生产依赖可复现、供应链可审计。这里把 pyproject 重编译到临时文件，
    #    按钉版行（忽略 header/注释）与已提交 lock 比对，不一致即红。
    # 2) 密钥扫描门禁：gitleaks 扫全 git 历史，真实 key 直接 fail CI。
    #    测试夹具里的占位假密钥由 .gitleaks.toml 按"具体假值"豁免。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks detect 需要完整 git 历史（含提交作者/信息），不能浅克隆。
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # 固定 uv 版本，保证 lock 漂移守卫可复现。requirements.lock 由 0.11.7 生成，
          # 不固定会随最新版解析结果漂移而误报。(setup-uv@v5 的输入参数名是 version)
          version: "0.11.7"

      - name: Dependency lock drift guard
        working-directory: agent
        run: |
          # 用已提交 requirements.lock 作为 constraint 重新编译：uv 把已提交的钉版
          # 当版本约束，只按 pyproject 声明求解。这样上游传递依赖发布新版本（如
          # langchain-anthropic 1.5.5→1.5.6）不会触发漂移误报——只有 pyproject.toml
          # 真正变更、已提交 lock 无法满足时才会 diff → 红。这是确定性的守卫，
          # 不再依赖实时 PyPI index 的重解析结果。 -o 写到 /tmp，避免就地覆盖。
          uv pip compile pyproject.toml -o /tmp/requirements.lock \
            --python-version 3.12 --no-strip-markers --constraint requirements.lock
          # 只比 钉版行 (pkg==version)，忽略所有注释行（含 -c 约束注解与 header），
          # 避免 cosmetic 差异造成误报。
          if ! diff -u <(grep -vE '^\s*#' requirements.lock) \
                       <(grep -vE '^\s*#' /tmp/requirements.lock); then
            echo "::error::requirements.lock 与 pyproject.toml 不一致。请在 agent/ 下运行: uv pip compile pyproject.toml -o requirements.lock --python-version 3.12 --no-strip-markers"
            exit 1
          fi

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan with gitleaks
        run: |
          # --redact: 泄漏的 key 打码后再进日志，避免二次泄露。
          gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev librsvg2-dev

      # 显式确认 openssl 原生库 + 头文件 + pkg-config 元数据都到位.
      # cargo 链接失败多半是 .so 找不到 / pkg-config 没配好, 这里先打出来
      # 免得靠猜. 失败不中断 (exit 0), 只留日志.
      - name: Verify libssl / openssl toolchain
        run: |
          echo "── dpkg: libssl packages ──"
          dpkg -l | grep -E 'libssl|openssl' || echo "(none found)"
          echo "── pkg-config: openssl ──"
          pkg-config --modversion openssl 2>&1 || echo "pkg-config openssl FAILED"
          echo "── pkg-config: openssl cflags ──"
          pkg-config --cflags --libs openssl 2>&1 || echo "pkg-config openssl cflags FAILED"
          echo "── headers: /usr/include/openssl/ssl.h ──"
          ls -l /usr/include/openssl/ssl.h 2>&1 || echo "ssl.h MISSING"
          echo "── libs: libssl.so ──"
          ldconfig -p | grep -E 'libssl\.so|libcrypto\.so' || echo "libssl.so not in ld cache"

      # tauri-build / generate_context! 在 cargo check 时校验 tauri.conf.json
      # 和 capabilities/ 里引用的所有文件路径. CI 上没有 sidecar 二进制、
      # 没有 npm build 产物. 直接写最小化 config + capabilities:
      #   - tauri.conf.json: bundle.active=false 跳过 bundle 校验
      #   - capabilities: 去掉 shell sidecar spawn 和 "pet" 窗口引用,
      #     否则 generate_context! 解析 capability 时会因找不到 sidecar panic.
      - name: Strip tauri config + capabilities for CI compile
        working-directory: desktop/src-tauri
        run: |
          cat > tauri.conf.json << 'TAURI_CI_CONF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "Huginn",
            "version": "0.1.0",
            "identifier": "com.huginn-agent.app",
            "build": {
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [{"title": "Huginn"}],
              "security": {"csp": "default-src 'self'"}
            },
            "bundle": {
              "active": false,
              "targets": [],
              "externalBin": [],
              "resources": [],
              "icon": []
            }
          }
          TAURI_CI_CONF
          cat > capabilities/default.json << 'TAURI_CI_CAP'
          {
            "identifier": "default",
            "description": "minimal CI capabilities",
            "windows": ["main"],
            "permissions": ["core:default"]
          }
          TAURI_CI_CAP
          mkdir -p ../dist
          echo '<!DOCTYPE html><html></html>' > ../dist/index.html
          # generate_context! 会读 icons/32x32.png 当默认窗口图标, 且要求是 RGBA.
          # 仓库里的图标是 RGB, 本地有 tauri icon 工具转 RGBA, CI 没有, 直接覆盖成
          # 一张合法的 RGBA 占位图 (亮蓝色 32x32), 只影响编译检查.
          python3 - << 'PY'
          import base64, zlib, struct
          b64 = "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAL0lEQVR4nO3OIQEAAAgDMJKQk4i0ghg3E/Ornr2kEhAQEBAQEBAQEBAQEBAQSAce4Tt0iMxmUi8AAAAASUVORK5CYII="
          png = base64.b64decode(b64)
          for name in ("32x32.png", "128x128.png", "128x128@2x.png", "icon.png"):
              with open(f"icons/{name}", "wb") as f:
                  f.write(png)
          print("Replaced RGB icons with RGBA placeholder")
          PY
          echo 'Minimal tauri.conf.json + capabilities + stub dist created'

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: |
          # tee 全量日志落盘, sed 去 ANSI 色码方便 grep
          cargo check --workspace 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee cargo_check_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose cargo failures to step summary
        if: failure()
        working-directory: desktop/src-tauri
        run: |
          if [ -f cargo_check_output.txt ]; then
            {
              echo '## cargo check output (last 150 lines)'
              echo '```'
              tail -150 cargo_check_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            # 常规 error/warning 行做 annotation
            grep -E '^(error|warning)' cargo_check_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=cargo::${line}"
            done
            # openssl / 原生链接错误单独挖出来, 判断是不是 libssl 缺
            OPENSSL_HITS=$(grep -iE 'openssl|libssl|libcrypto|cannot find|undefined reference|linker|runtime path|pkg-config' cargo_check_output.txt | head -40)
            if [ -n "$OPENSSL_HITS" ]; then
              {
                echo '## openssl / native link diagnostics'
                echo '```'
                echo "$OPENSSL_HITS"
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
            fi
            # cc 底层错误通常带 "error:" 前缀但不在行首, 抓 final 编译失败行
            CC_HITS=$(grep -E '\berror\b|error:' cargo_check_output.txt | grep -viE '^error\[' | head -30)
            if [ -n "$CC_HITS" ]; then
              {
                echo '## cc / native compile errors'
                echo '```'
                echo "$CC_HITS"
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload cargo output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-check-output
          path: desktop/src-tauri/cargo_check_output.txt

      - name: Cargo test
        working-directory: desktop/src-tauri
        run: cargo test --workspace

      - name: Cargo dependency vulnerability scan
        # Blocking gate: 用临时生成的 Cargo.lock 审计 workspace 全部 cargo 依赖.
        # Cargo.lock 被 gitignore (应用项目, 依赖图谱不提交), 但依赖漏洞仍需门禁.
        # RustSec 数据库扫到漏洞即红, 强制升级或记录豁免.
        run: |
          # $GITHUB_WORKSPACE 才是 runner 上的仓库根 (本地沙箱是 /workspace,
          # 但不能硬编码, 否则到 GitHub runner 上会 cd 到不存在的路径).
          cd "$GITHUB_WORKSPACE"
          cargo generate-lockfile
          # 用 cargo install 安装 cargo-audit (RustSec 不发布预编译二进制, 只有源码).
          # 安装失败必须红 (|| exit 1), 否则 audit 不存在时下面会静默放行, 门禁失效.
          cargo install cargo-audit --locked --quiet 2>&1 | tail -3 || {
            echo "::error::cargo-audit 安装失败, 无法执行 Rust 依赖漏洞审计"
            exit 1
          }
          cargo audit --json > /tmp/cargo_audit.json || {
            echo "::error::cargo audit 执行失败 (RustSec 网络或 advisory 解析错误)"
            exit 1
          }
          # 用 heredoc 传给 python3 -c, 避免单引号 + 反斜杠行继续符的转义地狱
          # (旧版把 f-string 里的 \" 和 \ 塞进 -c '...' 会触发
          # SyntaxError: unexpected character after line continuation character).
          python3 - << 'PY' || exit 1
          import json
          d = json.load(open("/tmp/cargo_audit.json"))
          lst = d.get("vulnerabilities", {}).get("list", [])
          n = len(lst)
          for v in lst:
              print(f"::error::cargo audit: {v['advisory']['id']} {v['advisory']['title']}")
          if n > 0:
              raise SystemExit(1)
          PY
          echo "cargo audit: no known vulnerabilities"