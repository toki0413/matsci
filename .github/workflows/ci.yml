name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel superseded runs when a new push lands on the same branch.
# Prevents stale python-tests jobs from hogging runner slots.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4.0"

      - name: Run ruff check (gating)
        working-directory: agent
        run: |
          # Blocking gate: CI lint 必须全绿.
          ruff check .

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          # Lightweight optional deps — keeps test coverage up on CI
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Add swap to prevent OOM
        run: |
          # github runner 只有 7G RAM, 4708 个测试串行跑会在 65% 处 OOM.
          # 加 6G swap (用 /swapfile-ci 避开系统默认 /swapfile 冲突).
          # TestClient/HuginnAgent 测试因内存重单独走 http-tests job.
          if [ ! -f /swapfile-ci ]; then
            sudo fallocate -l 6G /swapfile-ci
            sudo chmod 600 /swapfile-ci
            sudo mkswap /swapfile-ci
            sudo swapon /swapfile-ci
            echo "swap added:"
            swapon --show
          else
            echo "/swapfile-ci already exists"
          fi

      - name: Run tests
        env:
          HUGINN_RATE_LIMIT_ENABLED: "false"
          HUGINN_RATE_LIMIT_PER_MINUTE: "0"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HUGINN_CI: "1"
          # sklearn 的 GP 拟合底层走 scipy.linalg / OpenBLAS. 新版 numpy 在
          # GitHub runner 上偶发原生崩溃 (3.12/3.13 稳定复现, 3.11 正常),
          # 锁成单线程是这类 OpenBLAS 崩溃的通用解法, 顺带降低内存占用.
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          cd agent
          python -m pytest -v -rA --tb=line -p no:cov -o addopts="" \
            --timeout=60 --timeout-method=thread \
            -n 2 -m "not network" \
            --ignore=tests/test_api_contract.py \
            --ignore=tests/test_security_penetration.py \
            --ignore=tests/test_chaos_engineering.py \
            --ignore=tests/test_database_aflow_nomad.py \
            --ignore=tests/test_materials_database_tool.py \
            --ignore=tests/test_mock_misc_tools.py \
            --ignore=tests/stress \
            --ignore=tests/loops \
            --ignore=tests/sci_automation_test.py \
            --ignore=tests/test_api_version_compat.py \
            --ignore=tests/test_cors_security_headers.py \
            --ignore=tests/test_performance_load.py \
            --ignore=tests/test_audit_integrity.py \
            --ignore=tests/test_upload_security.py \
            --ignore=tests/test_i18n_encoding.py \
            --ignore=tests/test_kg.py \
            --ignore=tests/test_websocket_long.py \
            --ignore=tests/test_server_fastapi.py \
            --ignore=tests/test_chaos_fault_injection.py \
            --ignore=tests/test_error_boundaries.py \
            --ignore=tests/test_data_consistency.py \
            --ignore=tests/test_questions.py \
            --ignore=tests/test_session_timeout.py \
            --ignore=tests/test_rate_limiting.py \
            --ignore=tests/test_e2e_agent_flow.py \
            --ignore=tests/e2e_extended.py \
            --ignore=tests/e2e_user_journeys.py \
            --ignore=tests/test_route_smoke.py \
            --ignore=tests/test_ws_integration.py \
            --ignore=tests/test_team_v2_plans.py \
            --ignore=tests/test_server_coverage_boost.py \
            --ignore=tests/test_interaction.py \
            --ignore=tests/test_performance_regression.py \
            --ignore=tests/test_model_advisor.py \
            --ignore=tests/benchmark/test_performance.py \
            --maxfail=50 2>&1 | tee pytest_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose failures to step summary
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f agent/pytest_output.txt ]; then
            {
              echo '## pytest failures (last 150 lines)'
              echo '```'
              tail -150 agent/pytest_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            grep -E '^FAILED' agent/pytest_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=pytest::${line}"
            done
          else
            echo "::error::pytest_output.txt not found"
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: agent/pytest_output.txt
          retention-days: 7

  http-tests:
    # TestClient/HuginnAgent tests with module-scoped fixtures that crash
    # under --forked (fork + threads deadlock). Run serially (-n 0) without
    # --forked; each TestClient instantiates the full Huginn app (~2-3GB).
    #
    # Three groups: test_questions.py is a heavy integration script (registers
    # all tools, runs code_tool/sympy/Monte-Carlo UQ/HuginnAgent) that alone
    # consumes ~4-5GB. Running it after other TestClient files causes OOM
    # (MemoryError at test_code_tool_bandgap). Isolating it in group c gives
    # it the full 7GB+swap budget. Groups a/b hold the remaining 14 files.
    # Group d isolates e2e_user_journeys.py + e2e_extended.py — both start a
    # module-scoped TestClient that leaks anyio portal threads, hanging xdist
    # workers under -n 2 even without --forked.
    # Group e holds 6 more files with module-level `client = TestClient(app)`
    # at import time (test_route_smoke/test_ws_integration/test_team_v2_plans/
    # test_server_coverage_boost/test_interaction/test_performance_regression).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        test-group: [a, b, c, d, e]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Add swap to prevent OOM
        run: |
          if [ ! -f /swapfile-ci ]; then
            sudo fallocate -l 4G /swapfile-ci
            sudo chmod 600 /swapfile-ci
            sudo mkswap /swapfile-ci
            sudo swapon /swapfile-ci
            echo "swap added:"
            swapon --show
          else
            echo "/swapfile-ci already exists"
          fi

      - name: Run http/agent tests (serial, no --forked)
        env:
          HUGINN_RATE_LIMIT_ENABLED: "false"
          HUGINN_RATE_LIMIT_PER_MINUTE: "0"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HUGINN_CI: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          cd agent
          if [ "${{ matrix.test-group }}" = "a" ]; then
            # Group A — 8 lighter files (CORS/version/upload/i18n/kg/ws)
            FILES="tests/test_api_version_compat.py \
              tests/test_cors_security_headers.py \
              tests/test_performance_load.py \
              tests/test_audit_integrity.py \
              tests/test_upload_security.py \
              tests/test_i18n_encoding.py \
              tests/test_kg.py \
              tests/test_websocket_long.py"
          elif [ "${{ matrix.test-group }}" = "b" ]; then
            # Group B — 7 TestClient/Agent files (server/chaos/error/data/session/rate/e2e)
            FILES="tests/test_server_fastapi.py \
              tests/test_chaos_fault_injection.py \
              tests/test_error_boundaries.py \
              tests/test_data_consistency.py \
              tests/test_session_timeout.py \
              tests/test_rate_limiting.py \
              tests/test_e2e_agent_flow.py"
          elif [ "${{ matrix.test-group }}" = "c" ]; then
            # Group C — test_questions.py alone (heavy: code_tool/sympy/UQ/agent)
            FILES="tests/test_questions.py"
          elif [ "${{ matrix.test-group }}" = "d" ]; then
            # Group D — e2e_user_journeys.py + e2e_extended.py
            # Both start a module-scoped TestClient (full FastAPI app) that
            # leaks anyio portal threads under --forked; without --forked
            # they hang xdist workers. Run serially here.
            FILES="tests/e2e_user_journeys.py \
              tests/e2e_extended.py"
          else
            # Group E — 7 files with module-level `client = TestClient(app)`
            # at import time. Same anyio portal thread leak as group D;
            # running them under -n 2 hangs xdist workers. Run serially.
            # Also includes tests/benchmark/test_performance.py: its
            # TestSandboxTimeout::test_sandbox_timeout_result leaks threads
            # (subprocess.run timeout join thread) until xdist worker hits
            # `RuntimeError: can't start new thread` after ~5000 tests,
            # crashing the worker. Serial -n 0 keeps thread count bounded.
            FILES="tests/test_route_smoke.py \
              tests/test_ws_integration.py \
              tests/test_team_v2_plans.py \
              tests/test_server_coverage_boost.py \
              tests/test_interaction.py \
              tests/test_performance_regression.py \
              tests/test_model_advisor.py \
              tests/benchmark/test_performance.py"
          fi
          python -m pytest -v -rA --tb=short -p no:cov -o addopts="" \
            --timeout=60 --timeout-method=thread \
            -n 0 -m "not network" \
            $FILES \
            --maxfail=50 2>&1 | tee pytest_http_${{ matrix.test-group }}_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose failures to step summary
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          OUT="agent/pytest_http_${{ matrix.test-group }}_output.txt"
          if [ -f "$OUT" ]; then
            {
              echo "## http test failures (group ${{ matrix.test-group }}, last 150 lines)"
              echo '```'
              tail -150 "$OUT"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload http test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-http-${{ matrix.test-group }}-${{ matrix.python-version }}
          path: agent/pytest_http_${{ matrix.test-group }}_output.txt
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-file: tests/test_api_contract.py
            label: api-contract
            job-timeout: 30
            test-timeout: 60
          - test-file: tests/test_security_penetration.py
            label: security-penetration
            job-timeout: 20
            test-timeout: 120
          - test-file: tests/test_chaos_engineering.py
            label: chaos-engineering
            job-timeout: 20
            test-timeout: 120
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama
          pip install pytest-timeout

      - name: Run integration tests
        env:
          HUGINN_RATE_LIMIT_ENABLED: "false"
          HUGINN_RATE_LIMIT_PER_MINUTE: "0"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HUGINN_CI: "1"
        run: |
          cd agent
          pytest ${{ matrix.test-file }} -v --no-cov -m "integration and not network" --tb=short --timeout=${{ matrix.test-timeout }} 2>&1 | tee pytest_integration_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose integration failures to step summary
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f agent/pytest_integration_output.txt ]; then
            {
              echo '## integration test failures (last 150 lines)'
              echo '```'
              tail -150 agent/pytest_integration_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            grep -E '^(FAILED|ERROR|_ test)' agent/pytest_integration_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=integration::${line}"
            done
          fi

      - name: Upload integration test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-integration-${{ matrix.label }}
          path: agent/pytest_integration_output.txt
          retention-days: 7

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install and build
        run: |
          cd desktop
          npm ci
          npm run build

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e "./agent[dev]"

      - name: Policy engine self-check
        run: |
          cd agent
          python -m huginn.security.policy_engine

      - name: Dependency vulnerability scan
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Blocking gate: fail CI on known vulnerabilities.
          # pip is upgraded above so tooling-level advisories don't trip the gate.
          pip-audit --desc

      - name: Install test dependencies
        run: |
          pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
          pip install pymatgen ase paramiko pypdf pint spglib
          pip install toml croniter fastapi uvicorn nbformat
          pip install langchain-openai langgraph-checkpoint-sqlite
          pip install psutil pulp cvxpy scikit-fem anthropic langchain-ollama

      - name: SAST scan with bandit
        run: |
          pip install bandit
          cd agent
          # HIGH severity 必须为 0 (阻断 CI), MEDIUM 仅打印警告
          bandit -r huginn/ -lll || exit 1
          bandit -r huginn/ -ll -s B101 2>&1 | grep -E "Issue:|Total issues" || true
          # tests/ 目录单独扫, 允许 B101 (assert)
          bandit -r tests/ -lll -s B101 || exit 1

      - name: Run archive security PoC tests
        run: |
          cd agent
          python -m pytest tests/pentest_archive_safety.py -v --no-cov

      - name: Run API security PoC tests
        run: |
          cd agent
          python -m pytest tests/pentest_api_security.py -v --no-cov

      - name: Run API fuzz tests
        run: |
          cd agent
          python -m pytest tests/fuzz_api.py -v --no-cov

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev pkg-config \
            libayatana-appindicator3-dev librsvg2-dev

      # 显式确认 openssl 原生库 + 头文件 + pkg-config 元数据都到位.
      # cargo 链接失败多半是 .so 找不到 / pkg-config 没配好, 这里先打出来
      # 免得靠猜. 失败不中断 (exit 0), 只留日志.
      - name: Verify libssl / openssl toolchain
        run: |
          echo "── dpkg: libssl packages ──"
          dpkg -l | grep -E 'libssl|openssl' || echo "(none found)"
          echo "── pkg-config: openssl ──"
          pkg-config --modversion openssl 2>&1 || echo "pkg-config openssl FAILED"
          echo "── pkg-config: openssl cflags ──"
          pkg-config --cflags --libs openssl 2>&1 || echo "pkg-config openssl cflags FAILED"
          echo "── headers: /usr/include/openssl/ssl.h ──"
          ls -l /usr/include/openssl/ssl.h 2>&1 || echo "ssl.h MISSING"
          echo "── libs: libssl.so ──"
          ldconfig -p | grep -E 'libssl\.so|libcrypto\.so' || echo "libssl.so not in ld cache"

      # tauri-build / generate_context! 在 cargo check 时校验 tauri.conf.json
      # 和 capabilities/ 里引用的所有文件路径. CI 上没有 sidecar 二进制、
      # 没有 npm build 产物. 直接写最小化 config + capabilities:
      #   - tauri.conf.json: bundle.active=false 跳过 bundle 校验
      #   - capabilities: 去掉 shell sidecar spawn 和 "pet" 窗口引用,
      #     否则 generate_context! 解析 capability 时会因找不到 sidecar panic.
      - name: Strip tauri config + capabilities for CI compile
        working-directory: desktop/src-tauri
        run: |
          cat > tauri.conf.json << 'TAURI_CI_CONF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "Huginn",
            "version": "0.1.0",
            "identifier": "com.huginn-agent.app",
            "build": {
              "frontendDist": "../dist"
            },
            "app": {
              "windows": [{"title": "Huginn"}],
              "security": {"csp": "default-src 'self'"}
            },
            "bundle": {
              "active": false,
              "targets": [],
              "externalBin": [],
              "resources": [],
              "icon": []
            }
          }
          TAURI_CI_CONF
          cat > capabilities/default.json << 'TAURI_CI_CAP'
          {
            "identifier": "default",
            "description": "minimal CI capabilities",
            "windows": ["main"],
            "permissions": ["core:default"]
          }
          TAURI_CI_CAP
          mkdir -p ../dist
          echo '<!DOCTYPE html><html></html>' > ../dist/index.html
          # generate_context! 会读 icons/32x32.png 当默认窗口图标, 且要求是 RGBA.
          # 仓库里的图标是 RGB, 本地有 tauri icon 工具转 RGBA, CI 没有, 直接覆盖成
          # 一张合法的 RGBA 占位图 (亮蓝色 32x32), 只影响编译检查.
          python3 - << 'PY'
          import base64, zlib, struct
          b64 = "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAL0lEQVR4nO3OIQEAAAgDMJKQk4i0ghg3E/Ornr2kEhAQEBAQEBAQEBAQEBAQSAce4Tt0iMxmUi8AAAAASUVORK5CYII="
          png = base64.b64decode(b64)
          for name in ("32x32.png", "128x128.png", "128x128@2x.png", "icon.png"):
              with open(f"icons/{name}", "wb") as f:
                  f.write(png)
          print("Replaced RGB icons with RGBA placeholder")
          PY
          echo 'Minimal tauri.conf.json + capabilities + stub dist created'

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: |
          # tee 全量日志落盘, sed 去 ANSI 色码方便 grep
          cargo check --workspace 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee cargo_check_output.txt
          exit ${PIPESTATUS[0]}

      - name: Expose cargo failures to step summary
        if: failure()
        working-directory: desktop/src-tauri
        run: |
          if [ -f cargo_check_output.txt ]; then
            {
              echo '## cargo check output (last 150 lines)'
              echo '```'
              tail -150 cargo_check_output.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            # 常规 error/warning 行做 annotation
            grep -E '^(error|warning)' cargo_check_output.txt | head -20 | while IFS= read -r line; do
              echo "::error file=cargo::${line}"
            done
            # openssl / 原生链接错误单独挖出来, 判断是不是 libssl 缺
            OPENSSL_HITS=$(grep -iE 'openssl|libssl|libcrypto|cannot find|undefined reference|linker|runtime path|pkg-config' cargo_check_output.txt | head -40)
            if [ -n "$OPENSSL_HITS" ]; then
              {
                echo '## openssl / native link diagnostics'
                echo '```'
                echo "$OPENSSL_HITS"
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
            fi
            # cc 底层错误通常带 "error:" 前缀但不在行首, 抓 final 编译失败行
            CC_HITS=$(grep -E '\berror\b|error:' cargo_check_output.txt | grep -viE '^error\[' | head -30)
            if [ -n "$CC_HITS" ]; then
              {
                echo '## cc / native compile errors'
                echo '```'
                echo "$CC_HITS"
                echo '```'
              } >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload cargo output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-check-output
          path: desktop/src-tauri/cargo_check_output.txt

      - name: Cargo test
        working-directory: desktop/src-tauri
        run: cargo test --workspace
