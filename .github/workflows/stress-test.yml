name: Stress Test

on:
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  SERVER_PORT: "8999"
  HUGINN_API_KEY: test-key-12345
  HUGINN_DEV_MODE: "0"
  STRESS_TEST_URL: http://127.0.0.1:8999

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # The project ships deps through pyproject.toml; if a requirements.txt
          # is added later it takes precedence (matches the documented path).
          if [ -f agent/requirements.txt ]; then
            pip install -r agent/requirements.txt
          else
            pip install -e "./agent[dev]"
            pip install chromadb scikit-learn scipy sympy matplotlib sentence-transformers pymupdf
            pip install pymatgen ase paramiko pypdf pint spglib
            pip install toml croniter fastapi uvicorn
            pip install langchain-openai langgraph-checkpoint-sqlite
          fi
          pip install psutil pulp cvxpy anthropic langchain-ollama
          # Stress test clients (not pulled in by the app deps).
          pip install httpx websockets

      - name: Install k6
        run: |
          # 直接走 HTTPS 取签名公钥, 不再依赖 keyserver.ubuntu.com —— 该 keyserver
          # 在 runner 上间歇性返回 "gpg: keyserver receive failed: No data"
          # 导致步骤失败 (基础设施 flake, 与代码无关).
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Pre-warm embedding models
        working-directory: agent
        run: |
          # 全新 runner 上首次启动的大头是 chroma onnx (~80MB) + sentence-transformers
          # 多语言权重 (数百 MB) 的联网下载, 实测 2-4 分钟且随 runner/镜像站网络波动 ——
          # 会把 240s 健康窗口整个吃掉, 报 "backend did not become healthy within 240s"
          # (基础设施 flake, 与代码无关). 这里在起 uvicorn 前先把两份权重拉进 ~/.cache,
          # 下载发生在独立步骤(不受健康窗口约束), 之后启动只做本地加载(秒级), 窗口不再
          # 花在网络上. 单次 _EmbeddingModel().encode() 即覆盖 chroma onnx 与 ST 两条
          # 下载路径; 失败会走降级而非抛异常, 不新增独立的失败面.
          python - <<'PY'
          from huginn.knowledge.store import _EmbeddingModel
          _EmbeddingModel().encode(["warmup"])
          PY

      - name: Start backend
        working-directory: agent
        env:
          HUGINN_API_KEY: ${{ env.HUGINN_API_KEY }}
          HUGINN_DEV_MODE: ${{ env.HUGINN_DEV_MODE }}
        run: |
          uvicorn huginn.server:app --host 127.0.0.1 --port ${{ env.SERVER_PORT }} > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for health check
        run: |
          # 权重已在上一步预拉, 这里启动不再把窗口花在联网下载上; 240s 仅留给
          # 模型本地加载 + KB 初始化. 若仍超时, 看下方 uvicorn.log 定位真实原因.
          for i in $(seq 1 240); do
            if curl -sf "$STRESS_TEST_URL/health/live" >/dev/null; then
              echo "backend is healthy"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy within 240s"
          cat /tmp/uvicorn.log
          exit 1

      - name: Run k6 stress tests
        env:
          API_KEY: ${{ env.HUGINN_API_KEY }}
        continue-on-error: true
        run: |
          k6 run \
            -e STRESS_TEST_URL="$STRESS_TEST_URL" \
            -e API_KEY="$API_KEY" \
            agent/tests/stress/k6_stress.js 2>&1 | tee /tmp/k6.log

      - name: Run pytest stress tests (fallback)
        env:
          STRESS_TEST_URL: ${{ env.STRESS_TEST_URL }}
          HUGINN_API_KEY: ${{ env.HUGINN_API_KEY }}
        run: |
          python -m pytest agent/tests/stress/test_http_stress.py -v \
            --no-cov -o asyncio_mode=auto 2>&1 | tee /tmp/pytest-stress.log

      - name: Run ultra-long benchmark (gating)
        working-directory: agent
        timeout-minutes: 15
        run: |
          # 长程稳定性门禁: 内存泄漏/工具链重复/Registry/Memory 持续压测.
          # main() 在任一失败时 raise -> 非零退出 -> 此 job 失败.
          # 注意: 脚本在 tests/stress/ 下 (不是 tests/ 根), 路径须完整, 否则 No such file.
          python tests/stress/ultra_long_benchmark.py 2>&1 | tee /tmp/ultra_long.log
          exit ${PIPESTATUS[0]}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-logs
          path: |
            /tmp/uvicorn.log
            /tmp/k6.log
            /tmp/pytest-stress.log
            /tmp/ultra_long.log

      - name: Stop backend
        if: always()
        run: |
          [ -f /tmp/uvicorn.pid ] && kill "$(cat /tmp/uvicorn.pid)" 2>/dev/null || true
