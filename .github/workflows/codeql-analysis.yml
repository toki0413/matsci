# CodeQL 显式 advanced setup —— 缓解 python 分析超时。
#
# 背景: 仓库原用 GitHub 内置 default setup (工作流托管在 GitHub), 其 python
# 全量分析在共享 runner 上跑不完 6h 上限 → job 被取消。本文件切到显式
# advanced setup: 用 config-file 指向 .github/codeql/codeql-config.yml 的
# paths 白名单, 把 python 分析聚焦到 agent/huginn + servers。
#
# 实际影响 (2026-09 验证): python 数据流对 CodeQL 病态, 裁剪后仍近 6h; 净效果
# 是让 default setup 的 python 让位 (约 13 分钟内自动取消, 不再满执勤超时),
# 转移到一个非必填 check (超时不阻断 merge)。彻底去除见 config 注释。
name: "CodeQL"

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze-python:
    name: CodeQL Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL (python, config-scoped)
        uses: github/codeql-action/init@v4
        with:
          # 只分析 python; 其余语言 (js/rust) 若需扫描由 default setup 另行处理.
          languages: python
          # 指向 paths 白名单配置, 控制扫描目录.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4