# 红/蓝覆盖矩阵门禁: 把 scripts/coverage_matrix_audit.py 固化为只读 CI 检查.
#
# 把 docs/threat_model.md §6 "Red / Blue Coverage Matrix" 的表格和基线对比:
#   - 表里引用的每个测试资产必须真实存在 (断链引用 = 声称的覆盖已静默失效);
#   - 任一攻击面的覆盖等级 (none < single < dual) 不得低于基线 (补测只增不减).
# 纯 stdlib, 无第三方依赖, 秒级完成.
name: Coverage Matrix Audit

on:
  schedule:
    # 每周一 02:00 UTC (周一上午北京 10:00), 与 skill-audit 同时段.
    - cron: '0 2 * * 1'
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths:
      - 'docs/threat_model.md'
      - 'scripts/coverage_matrix_audit.py'
      - 'scripts/coverage_matrix_baseline.json'
      - 'agent/tests/security/**'
      - 'agent/tests/test_lean*.py'
      - 'agent/tests/test_hpc*.py'
      - 'agent/tests/test_credential*.py'
      - 'agent/tests/test_config_encryption.py'
      - 'agent/tests/test_privacy.py'
      - 'agent/tests/test_mcp*.py'
      - 'agent/tests/test_red_team.py'
      - 'agent/tests/test_blue_team.py'
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/threat_model.md'
      - 'scripts/coverage_matrix_audit.py'
      - 'scripts/coverage_matrix_baseline.json'
      - 'agent/tests/security/**'
      - 'agent/tests/test_lean*.py'
      - 'agent/tests/test_hpc*.py'
      - 'agent/tests/test_credential*.py'
      - 'agent/tests/test_config_encryption.py'
      - 'agent/tests/test_privacy.py'
      - 'agent/tests/test_mcp*.py'
      - 'agent/tests/test_red_team.py'
      - 'agent/tests/test_blue_team.py'

permissions:
  contents: read

jobs:
  coverage-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run coverage matrix audit (gate)
        working-directory: ${{ github.workspace }}
        run: |
          # pipefail 保证 python 门禁退出码 (断链引用 / 覆盖回退) 不会被 tee 吞掉.
          set -euo pipefail
          python scripts/coverage_matrix_audit.py --json \
            --fail-on-regression \
            --baseline scripts/coverage_matrix_baseline.json \
            2>&1 | tee coverage_matrix_output.txt
          # 抽出 JSON 摘要供后续步骤消费.
          python - << 'PY'
          import json, re
          text = open("coverage_matrix_output.txt", encoding="utf-8").read()
          m = re.search(r"\[JSON\]\n(\{.*\})", text, re.S)
          if not m:
              raise SystemExit("no [JSON] block found in audit output")
          data = json.loads(m.group(1))
          with open("coverage_matrix.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          su = data["summary"]
          print(f"summary: surfaces={su['total']} dual={su['dual']} "
                f"single={su['single']} none={su['none']} broken={su['broken_refs']}")
          PY

      - name: Summarize to step summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f coverage_matrix.json ]; then
            {
              echo '## 红/蓝覆盖矩阵巡检'
              echo '```json'
              cat coverage_matrix.json
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::coverage_matrix.json not produced (audit failed to run)"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-matrix-report
          path: |
            ${{ github.workspace }}/coverage_matrix.json
            ${{ github.workspace }}/coverage_matrix_output.txt
          retention-days: 30
